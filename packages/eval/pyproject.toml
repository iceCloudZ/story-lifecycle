[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eval"
version = "0.1.0"
description = "Offline eval layer for story-lifecycle: gold dataset extraction + LLM judges + replay regression"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "zhaozihao"},
]
keywords = ["ai", "eval", "benchmark", "judge", "story-lifecycle"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    # story-lifecycle: llm_client (judge 调用) + harness (回放) 复用,workspace 内
    # editable install 解析,无版本 pin
    "pydantic>=2.0",
    "httpx>=0.24",
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
eval = "eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eval"]
